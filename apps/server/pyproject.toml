[project]
name = "autohunt-server"
version = "0.1.0"
description = "autohunt backend (FastAPI + SQLite, 技术设计 v1.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "sqlmodel>=0.0.22",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "autohunt-domain",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.28", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
